<script>
/* ==== Configuration Supabase (la même que dans l'application) ==== */
window.TADBIR_CONFIG = { url: "https://vxyxbkpjtonkojclukmf.supabase.co", anonKey: "sb_publishable_lanzT2mLiGVlEotqtsQACQ_xIiCycAm" };

/* ==== Thèmes de la console : [clé, nom, barre latérale, accent, fond, description, couleur barre mobile] ==== */
window.TB_THEMES=[
  ['ocean','Océan','#1e293b','#0891b2','#f1f5f9','Bleu marine et cyan — classique','#0f172a'],
  ['indigo','Indigo','#1e1b4b','#4f46e5','#f5f6fb','Style SaaS moderne','#1e1b4b'],
  ['emeraude','Émeraude','#052e2b','#059669','#f3f7f5','Vert profond, esprit finance','#052e2b'],
  ['prestige','Prestige','#1c1917','#b45309','#f5f5f4','Noir et or, haut de gamme','#1c1917'],
  ['graphite','Graphite','#ffffff','#18181b','#fafafa','Clair et minimaliste','#18181b'],
  ['nuit','Nuit','#0a0f1c','#22d3ee','#0b1120','Mode sombre, repose les yeux','#0a0f1c']
];
(function(){
  var KEY='tadbir_console_theme',T=window.TB_THEMES;
  function find(k){for(var i=0;i<T.length;i++)if(T[i][0]===k)return T[i];return null}
  window.tbCur=function(){return document.documentElement.getAttribute('data-theme')||'ocean'};
  window.tbTheme=function(k){
    if(k){try{localStorage.setItem(KEY,k)}catch(e){}}else{try{k=localStorage.getItem(KEY)}catch(e){}}
    var t=find(k)||T[0];document.documentElement.setAttribute('data-theme',t[0]);
    var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t[6]);
    document.querySelectorAll('[data-theme-k]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-theme-k')===t[0])});
    return t[0];
  };
  window.tbSwatches=function(){var c=window.tbCur();return '<div class="sw">'+T.map(function(t){
    return '<button type="button" data-theme-k="'+t[0]+'" class="'+(t[0]===c?'on':'')+'" title="Thème '+t[1]+'" aria-label="Thème '+t[1]+'" style="background:linear-gradient(135deg,'+t[2]+' 0 50%,'+t[3]+' 50% 100%)"></button>'}).join('')+'</div>'};
  window.tbTiles=function(){var c=window.tbCur();return '<div class="thg">'+T.map(function(t){
    return '<button type="button" class="thtile'+(t[0]===c?' on':'')+'" data-theme-k="'+t[0]+'"><span class="thpv"><i style="background:'+t[2]+'"></i><span style="background:'+t[4]+'"><em style="width:72%"></em><em style="width:48%"></em><u style="background:'+t[3]+'"></u></span></span><span class="thn"><b>'+t[1]+'</b></span><small>'+t[5]+'</small></button>'}).join('')+'</div>'};
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-theme-k]');if(b)window.tbTheme(b.getAttribute('data-theme-k'))});
  window.tbTheme();
  /* ---- date et heure ---- */
  function p2(n){return (n<10?'0':'')+n}
  var JOURS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  /* Heure du Maroc = GMT (UTC+0) depuis le 20/09/2026 (décret n° 2.26.530).
     Calculée directement en UTC : ne dépend ni du réglage de l'appareil ni de la base horaire du navigateur
     (certains navigateurs appliquent encore l'ancien GMT+1). Pour changer de décalage : MA_OFFSET_MIN. */
  var MA_OFFSET_MIN=0;
  function parts(){var d=new Date(Date.now()+MA_OFFSET_MIN*60000);
    return {h:p2(d.getUTCHours()),m:p2(d.getUTCMinutes()),s:p2(d.getUTCSeconds()),day:JOURS[d.getUTCDay()],date:p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()}}
  window.tbClock=function(){var x=parts();return x.h+':'+x.m+' · '+x.date};
  window.tbClockHTML=function(){var x=parts();
    return '<span class="ck-hm"><span data-ck="h">'+x.h+'</span><i>:</i><span data-ck="m">'+x.m+'</span></span>'
      +'<span class="ck-dt"><span data-ck="day">'+x.day+'</span><em aria-hidden="true">·</em><span data-ck="date">'+x.date+'</span></span>'};
  function tick(){var x=parts(),t=window.tbClock();
    document.querySelectorAll('[data-ck]').forEach(function(e){var v=x[e.getAttribute('data-ck')];if(e.textContent!==v)e.textContent=v});
    document.querySelectorAll('.clk-m').forEach(function(e){if(e.textContent!==t)e.textContent=t})}
  setInterval(tick,1000);document.addEventListener('visibilitychange',tick);
})();
</script>
<style>
:root{
  --ink:#0f172a;--ink2:#334155;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;
  --navy:#1e293b;--navy2:#334155;--acc:#0891b2;--acc2:#ecfeff;--blue:#0891b2;--blue2:#e0f7fb;--cyan:#06b6d4;
  --red:#c2341b;--red2:#fdeeea;--amb:#a86400;--amb2:#fff4e0;--grn:#1d7a43;--grn2:#e7f6ec;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hide{display:none!important}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--navy);color:#cbd5e1;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
.logo{width:40px;height:40px;flex:none;display:grid;place-items:center}
.logo svg{width:40px;height:40px;display:block}
.side .logo .hx{stroke:rgba(255,255,255,.28);stroke-width:1.2}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:.01em}
.brand small{color:#94a3b8;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.nav{display:grid;gap:3px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#cbd5e1;font-weight:600;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--cyan)}
.nav .cnt{margin-inline-start:auto;background:var(--cyan);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.sidefoot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#94a3b8}
.sidefoot b{color:#fff;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.sidefoot button{all:unset;cursor:pointer;color:#cbd5e1;margin-top:8px;font-weight:600}
.demo-tag{display:inline-block;background:#ffcf5c;color:#3d2a00;font-weight:700;font-size:10px;letter-spacing:.08em;padding:2px 7px;border-radius:6px;margin-top:6px}

.main{padding:26px 32px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h1{margin:0;font-size:24px;letter-spacing:-.02em}
.head p{margin:3px 0 0;color:var(--mut)}
.crumb{font-size:12px;color:var(--mut);margin-bottom:4px}
.crumb button{all:unset;cursor:pointer;color:var(--blue);font-weight:600}

/* ---------- elements ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:650;cursor:pointer;background:var(--blue);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:#f8fafc}
.btn.acc{background:var(--acc)}
.btn.danger{background:#fff;color:var(--red);border-color:#f2c6bc}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px}
.card-h small{color:var(--mut)}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi span{display:block;color:var(--mut);font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-size:28px;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}

table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #eef2f6;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8fafc}
.tw{overflow-x:auto}
.nm b{display:block}
.nm small{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--grn2);color:var(--grn)}
.b-soon{background:var(--amb2);color:var(--amb)}
.b-exp{background:var(--red2);color:var(--red)}
.b-sus{background:#f1f5f9;color:#475569}
.b-pend{background:var(--blue2);color:var(--blue)}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:7px;background:#f1f5f9;color:var(--ink2)}

.seats{display:flex;align-items:center;gap:9px;min-width:120px}
.bar{flex:1;height:6px;background:#e2e8f0;border-radius:9px;overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.bar i.full{background:var(--amb)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);background:#fff}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--ink2)}
.field input,.field select,.field textarea,.inp{padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:2px solid #a5f3fc;border-color:var(--blue)}
.field small{color:var(--mut);font-size:12px}
.fg{align-items:start;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg .full{grid-column:1/-1}
.sect{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:18px 0 10px}
.sect:first-child{margin-top:0}

.empty{padding:34px 18px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.muted{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* detail */
.dh{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:20px 22px}
.dh h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.facts div{padding:14px 22px;border-inline-end:1px solid var(--line)}
.facts div:last-child{border-inline-end:0}
.facts span{display:block;font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.facts b{display:block;font-size:16px;margin-top:3px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:13px 10px;font-weight:650;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--blue)}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}
.info span{display:block;font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.info b{font-weight:600;word-break:break-word}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat span{font-size:12px;color:var(--mut);font-weight:650}
.stat b{display:block;font-size:22px;margin-top:2px}
.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px}
.tog input{width:36px;height:20px;appearance:none;background:#cbd5e1;border-radius:20px;position:relative;cursor:pointer;transition:.15s;margin:0;flex:none}
.tog input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog input:checked{background:var(--acc)}
.tog input:checked::after{left:18px}
.tog input:disabled{opacity:.5}
.inline-in{padding:6px 9px;border:1px solid #cbd5e1;border-radius:8px;width:100%;min-width:130px}
.sel{padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
.log{display:grid}
.log div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #eef2f6}
.log div:last-child{border-bottom:0}
.log time{color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
.log b{font-weight:650}
.log small{color:var(--mut)}
.alert{display:block;padding:12px 14px;line-height:1.5;border-radius:11px;font-size:13.5px}
.alert.warn{background:var(--amb2);color:#6b4100}
.alert.info{background:var(--blue2);color:#155e75}
.alert.err{background:var(--red2);color:#8f2512}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.code{display:block;background:#0f172a;color:#d4f1f8;border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-all;margin:8px 0}
.steps{counter-reset:s;display:grid;gap:14px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.steps b{display:block;margin-bottom:2px}

/* paramètres société */
.imgs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.imgt{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:grid;gap:8px}
.imgt>span{font-size:12px;font-weight:700;color:var(--ink2)}
.imgt .pv{height:84px;display:grid;place-items:center;border-radius:8px;background:repeating-conic-gradient(#f1f5f9 0 25%,#fff 0 50%) 0 0/14px 14px;overflow:hidden}
.imgt .pv img{max-width:100%;max-height:80px}
.imgt .pv em{font-style:normal;font-size:12px;color:var(--mut)}
.imgt .row{justify-content:center;gap:6px}
.imgt label.btn{cursor:pointer}
.savebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
/* relances */
.tone{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.t-rappel{background:#e0f7fb;color:#155e75}.t-urgent{background:#fff4e0;color:#8a5300}.t-relance{background:#fdeeea;color:#a12d16}.t-ferme{background:#fbd5cc;color:#7a1d0c}.t-susp{background:#f1f5f9;color:#475569}
.rmsg{width:100%;min-height:190px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;line-height:1.5;resize:vertical}
.rmsg:focus{outline:2px solid #a5f3fc;border-color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--navy);color:#fff}
.btn.wa{background:#16a34a}.btn.wa:hover{background:#15803d}
@media (max-width:900px){.imgs{grid-template-columns:1fr 1fr}}

/* onglets */
.modal.md{width:min(580px,100%)}
.tsum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tsum b{font-size:15px}
.tg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.tg-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.tg-h small{color:var(--mut);font-weight:600;letter-spacing:0;text-transform:none}
.tg-h button{all:unset;cursor:pointer;margin-inline-start:auto;font-size:12px;font-weight:600;color:var(--mut);text-transform:none;letter-spacing:0}
.tg-h button:hover{color:var(--red)}
.tg-c{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:3px;padding:4px 4px 4px 10px;border-radius:999px;background:var(--blue2);color:#155e75;font-size:13px;font-weight:600}
.tchip.lock{padding-right:10px;background:#f1f5f9;color:var(--ink2)}
.tchip button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;color:#155e75}
.tchip button:hover{background:#fbd5cc;color:var(--red)}
.tadd{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px dashed #cbd5e1;color:var(--ink2);font-size:13px;font-weight:600;background:#fff}
.tadd:hover{border-color:var(--blue);color:var(--blue);background:var(--blue2)}
.tg-empty{font-size:12.5px;color:var(--mut)}
.addp{border:1px dashed #cbd5e1;border-radius:12px;padding:12px;margin-top:6px;background:#f8fafc}
.addp .tg{background:#fff}
.mf .lnk{all:unset;cursor:pointer;margin-inline-end:auto;font-size:13px;font-weight:600;color:var(--blue);text-decoration:underline;text-underline-offset:2px;align-self:center}
.tbtn{display:inline-flex;align-items:center;gap:6px}
.tbtn i{font-style:normal;font-size:11px;font-weight:700;background:var(--blue2);color:#155e75;border-radius:999px;padding:1px 7px}

/* inventaire */
tfoot td{font-weight:700;background:#f8fafc;border-top:2px solid var(--line);border-bottom:0}
.b-paid{background:var(--grn2);color:var(--grn)}
.b-part{background:var(--amb2);color:var(--amb)}
.b-unpaid{background:var(--red2);color:var(--red)}
.b-free{background:#f1f5f9;color:#475569}
.sumg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.sumt th,.sumt td{padding:9px 14px}
.sumt td.num,.sumt th.num,.invt td.num,.invt th.num{text-align:end}
.rec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rec .stat b{font-size:19px}
.rec .stat small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.rbar{height:8px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-top:8px}
.rbar i{display:block;height:100%;background:var(--grn)}
.invt td.nm{min-width:170px}
.ph{display:none}
@media (max-width:1100px){.sumg{grid-template-columns:1fr}.rec{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body,html{background:#fff}
  .side,.toolbar,.noprint,.toast,.head .row{display:none!important}
  .shell{display:block}.main{padding:0}
  .card{box-shadow:none;break-inside:avoid}
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr))!important}
  .sumg{grid-template-columns:1fr 1fr}
  .ph{display:block;margin-bottom:8px;color:var(--mut);font-size:12px}
  td,th{padding:6px 8px;font-size:11px}
  .hide-m{display:table-cell!important}
}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:min(760px,100%);box-shadow:0 30px 70px -20px rgba(0,0,0,.45)}
.modal.sm{width:min(460px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:18px}
.mh button{all:unset;cursor:pointer;font-size:22px;color:var(--mut);line-height:1;padding:4px}
.mb{padding:18px 22px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#f8fafc;border-radius:0 0 16px 16px}
.urow{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 34px;gap:8px;margin-bottom:8px}
.urow button{all:unset;cursor:pointer;color:var(--mut);text-align:center;font-size:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:11px;font-weight:600;z-index:80;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:92vw}
.toast.err{background:var(--red)}

/* auth screens — même page d'accueil que l'application Tadbir */
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px;background:#1e293b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18283b}
.gbox{background:#fff;border-radius:16px;width:min(420px,100%);padding:32px 30px;box-shadow:0 28px 64px -20px rgba(0,0,0,.55)}
.gbrand{display:flex;align-items:center;justify-content:center;gap:9px;margin:-4px 0 18px}
.gbrand svg{width:42px;height:42px;display:block;flex:none}
.gbrand .tb-w{display:block;font-family:Sora,Inter,sans-serif;font-size:21px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#0f172a;line-height:1.05}
.gbrand .tb-w::after{content:".";color:#06b6d4}
.gbrand small{display:flex;justify-content:space-between;gap:3px;margin-top:5px;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#64748b;line-height:1}
.gbox h2{margin:4px 0;font-size:24px;font-weight:700;letter-spacing:-.01em;color:#0f172a}
.gbox p{margin:0 0 22px;color:#64748b;line-height:1.5}
.gbox form{display:grid;gap:16px}
.gbox .field{gap:7px}
.gbox .field label{font-size:12px;font-weight:700;color:#334155}

.gbox .field input:focus{outline:2px solid #a5f3fc;border-color:#0891b2}
.gbox .btn{justify-content:center;width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:700;background:#0891b2;border:0}
.gbox .btn:hover{background:#0e7490;filter:none}
.gbox .btn.sec{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
.gbox .btn.sec:hover{background:#f8fafc}
.gbox a{color:#0891b2}
.gbox .code{background:#0f172a}
.pw{position:relative;display:block}
.pw input{padding-right:46px!important}

  .nav{display:flex;overflow-x:auto;gap:2px}
  .nav button{padding:8px 10px;font-size:13px;white-space:nowrap}.nav button svg{display:none}
  .sidefoot{display:none}

<script>
(function(){
'use strict';

/* =====================================================================
   Utilitaires
   ===================================================================== */
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLES=['Administrateur','Responsable','Employé'];
const PLANS={Essai:{months:0,days:14,label:'Essai (14 jours)'},Mensuel:{months:1,days:0,label:'Mensuel'},Annuel:{months:12,days:0,label:'Annuel'}};
/* Onglets de l'application Tadbir (identifiants = data-page) */
const TAB_GROUPS=[
  ['Général',[['dashboard','Tableau de bord']]],

  ['Clients',[['clients','Clients'],['situation','Situation clients'],['relances','Relances clients'],['avoirs','Avoirs clients'],['avpay','Paiements des avoirs']]],
  ['Stock et achats',[['stock','Gestion du stock'],['damaged','Marchandise endommagée'],['achat','Achats & fournisseurs'],['reappro','Réapprovisionnement'],['bcmd','Bons de commande'],['depenses','Toutes les dépenses'],['deprecur','Dépenses récurrentes']]],
  ['Finance',[['caisses','Gestion des caisses'],['payonline','Paiement en ligne'],['finance','Finance'],['encaissements','Encaissements'],['caisse','Caisse'],['pilotage','Pilotage'],['rapports','Rapports'],['calendrier','Calendrier']]],
  ['Ressources humaines',[['monespace','Mon espace'],['rh','RH'],['rhdemandes','Demandes RH'],['rhmsg','Messagerie RH'],['depts','Départements'],['charges','Charges']]],
  ['Administration',[['journal','Journal & contrôle'],['sauvegardes','Sauvegardes'],['emails','Emails'],['utilisateurs','Utilisateurs'],['parametres','Paramètres'],['maintenance','Diagnostic'],['profil','Profil'],['corbeille','Corbeille']]]
];
const ALL_TABS=TAB_GROUPS.reduce((a,g)=>a.concat(g[1].map(t=>t[0])),[]);
const TAB_LABEL={};TAB_GROUPS.forEach(g=>g[1].forEach(t=>TAB_LABEL[t[0]]=t[1]));
const LOCKED_TABS=['dashboard'];
const COLL={invoices:'Factures',bls:'Bons de livraison',clients:'Clients',products:'Produits',purchases:'Achats',suppliers:'Fournisseurs',employees:'Employés',cashMoves:'Mouvements caisse'};
const ICON={
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  co:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  cog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  tabs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v5M15 4v5"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  inv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M8 12h8M8 16h5"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>'
};
function pad(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseD(s){if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null}
function daysBetween(a,b){return Math.round((parseD(b)-parseD(a))/864e5)}
function addPeriod(s,months,days){
  const t=parseD(s)||parseD(todayStr());const d=new Date(t);
  let y=d.getUTCFullYear(),m=d.getUTCMonth()+(months||0),dd=d.getUTCDate();
  y+=Math.floor(m/12);m=((m%12)+12)%12;
  const dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const r=new Date(Date.UTC(y,m,Math.min(dd,dim))+(days||0)*864e5);
  return r.getUTCFullYear()+'-'+pad(r.getUTCMonth()+1)+'-'+pad(r.getUTCDate());
}
function fd(s){if(!s)return '—';const t=parseD(s);if(t==null)return '—';const d=new Date(t);return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()}
function fdt(s){if(!s)return '—';const d=new Date(s);if(isNaN(d))return '—';return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function ago(s){if(!s)return 'Jamais';const d=(Date.now()-new Date(s).getTime())/1000;if(d<90)return 'À l’instant';if(d<3600)return 'Il y a '+Math.round(d/60)+' min';if(d<86400)return 'Il y a '+Math.round(d/3600)+' h';const j=Math.round(d/86400);return j<=1?'Hier':'Il y a '+j+' j'}
function money(n){return (Number(n)||0).toLocaleString('fr-MA',{minimumFractionDigits:0,maximumFractionDigits:2})}
function uid(){return crypto.randomUUID?crypto.randomUUID():'d'+Date.now().toString(36)+Math.random().toString(36).slice(2)}
function emailOk(e){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(e||'').trim())}

/* état d'une société */
function cState(c){
  if(c.status==='suspended')return {k:'sus',t:'Suspendue'};
  if(c.expires_at){const d=daysBetween(todayStr(),c.expires_at);
    if(d<0)return {k:'exp',t:'Expirée',d};
    if(d<=15)return {k:'soon',t:d===0?'Expire aujourd’hui':'Expire dans '+d+' j',d};
    return {k:'ok',t:'Active',d};}
  return {k:'ok',t:'Active',d:null};
}
function badge(c){const s=cState(c);return '<span class="badge b-'+s.k+'">'+E(s.t)+'</span>'}
function monthly(c){const p=Number(c.price_mad)||0;return c.plan==='Annuel'?p/12:c.plan==='Mensuel'?p:0}

/* =====================================================================
   Accès aux données — Supabase ou démonstration
   ===================================================================== */
function cfg(){
  const w=window.TADBIR_CONFIG||{};if(w.url&&w.anonKey)return {url:w.url,anonKey:w.anonKey,fixed:true};
  try{const s=JSON.parse(localStorage.getItem('tadbir_console_cfg')||'null');if(s&&s.url&&s.anonKey)return s}catch(e){}
  return null;
}

function SupabaseAPI(c){
  let sb=null;
  async function client(){
    if(sb)return sb;
    if(!window.supabase){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=res;s.onerror=()=>rej(new Error('Impossible de charger le module Supabase. Vérifiez la connexion internet.'));document.head.appendChild(s)})}
    sb=window.supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'tadbir_console_auth'}});
    return sb;
  }
  async function rpc(n,a){const s=await client();const r=await s.rpc(n,a||{});if(r.error)throw new Error(r.error.message);return r.data}
  return {
    demo:false,
    async session(){const s=await client();const r=await s.auth.getSession();return r.data&&r.data.session?r.data.session.user:null},
    async login(email,pw){const s=await client();const r=await s.auth.signInWithPassword({email,password:pw});if(r.error)throw new Error(/invalid/i.test(r.error.message)?'E-mail ou mot de passe incorrect.':/confirm/i.test(r.error.message)?'Confirmez d’abord votre e-mail (lien reçu).':r.error.message);return r.data.user},
    async signup(email,pw,name){const s=await client();const r=await s.auth.signUp({email,password:pw,options:{data:{full_name:name}}});if(r.error)throw new Error(r.error.message);return !!(r.data&&r.data.session)},
    async forgot(email){const s=await client();const r=await s.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});if(r.error)throw new Error(r.error.message)},
    async logout(){const s=await client();await s.auth.signOut()},
    whoami:()=>rpc('admin_whoami'),
    overview:()=>rpc('admin_overview'),
    detail:id=>rpc('admin_company_detail',{p_id:id}),
    saveCompany:p=>rpc('admin_save_company',{p}),
    setStatus:(id,s)=>rpc('admin_set_status',{p_id:id,p_status:s}),
    extend:(id,m,d)=>rpc('admin_extend',{p_id:id,p_months:m,p_days:d||0}),
    invite:(cid,email,name,role)=>rpc('tb_invite',{p_company:cid,p_email:email,p_name:name,p_role:role}),
    cancelInvite:id=>rpc('tb_cancel_invite',{p_id:id}),
    setMember:(u,cid,role,active,name)=>rpc('admin_set_member',{p_user:u,p_company:cid,p_role:role,p_active:active,p_name:name}),
    deleteCompany:(id,conf)=>rpc('admin_delete_company',{p_id:id,p_confirm:conf}),
    getTabs:cid=>rpc('admin_get_tabs',{p_company:cid}),
    setTabs:(kind,id,tabs)=>rpc('admin_set_tabs',{p_kind:kind,p_id:id,p_tabs:tabs}),
    async getSettings(cid){const r=await rpc('admin_get_settings',{p_company:cid})||{};const P=v=>{try{return v?JSON.parse(v):null}catch(e){return null}};return {company:P(r.company),tax:P(r.tax)}},
    setSettings:(cid,kind,obj)=>rpc('admin_set_settings',{p_company:cid,p_key:kind==='tax'?'__taxSettings':'nlc_company_v65',p_value:JSON.stringify(obj)}),
    reminders:()=>rpc('admin_reminders'),
    addReminder:(cid,channel,tone)=>rpc('admin_add_reminder',{p_company:cid,p_channel:channel,p_tone:tone}),
    payments:()=>rpc('admin_payments'),
    setPayment:(cid,p)=>rpc('admin_set_payment',{p_company:cid,p:p||null})
  };
}

/* ---------- démonstration (données sur cet appareil uniquement) ---------- */
function DemoAPI(){
  const K='tadbir_console_demo';
  function seed(){
    const t=todayStr(),now=new Date().toISOString();
    const c1={id:uid(),name:'BSM ELEVATOR',legal_form:'SARL',city:'Tanger',ice:'003868143000039',phone:'08 08 56 10 17',email:'info@bsmelevator.com',contact:'Direction',plan:'Annuel',price_mad:12000,max_users:50,status:'active',starts_at:addPeriod(t,-3),expires_at:addPeriod(t,9),notes:'',created_at:now};
    const c2={id:uid(),name:'Atlas Lift SARL',legal_form:'SARL',city:'Casablanca',phone:'05 22 00 00 00',email:'contact@atlaslift.ma',contact:'M. Alaoui',plan:'Essai',price_mad:0,max_users:3,status:'active',starts_at:addPeriod(t,0,-9),expires_at:addPeriod(t,0,5),notes:'Démo faite le '+fd(addPeriod(t,0,-9)),created_at:now};
    const c3={id:uid(),name:'Rif Ascenseurs',legal_form:'SARL AU',city:'Tétouan',plan:'Mensuel',price_mad:900,max_users:5,status:'suspended',starts_at:addPeriod(t,-2),expires_at:addPeriod(t,0,12),notes:'Retard de paiement',created_at:now};
    const m=(c,n,e,r,a,seen)=>({user_id:uid(),company_id:c?c.id:null,full_name:n,email:e,role:r,active:a,created_at:now,last_seen_at:seen});
    const h=x=>new Date(Date.now()-x*3600e3).toISOString();
    return {companies:[c1,c2,c3],
      members:[m(c1,'Directeur BSM','direction@bsmelevator.com','Administrateur',true,h(1)),m(c1,'Commercial 1','commercial@bsmelevator.com','Employé',true,h(5)),m(c1,'Magasin','magasin@bsmelevator.com','Responsable',true,h(28)),
        m(c2,'Karim Alaoui','karim@atlaslift.ma','Administrateur',true,h(50)),m(c3,'Youssef R.','youssef@rif-asc.ma','Administrateur',true,h(400)),
        m(null,'Nouveau compte','inconnu@gmail.com','Employé',false,null)],
      invitations:[{id:uid(),company_id:c2.id,email:'stock@atlaslift.ma',full_name:'Magasinier Atlas',role:'Employé',created_at:now}],
      stats:{[c1.id]:{invoices:412,bls:274,clients:88,products:640,purchases:57},[c2.id]:{invoices:6,clients:4,products:31},[c3.id]:{invoices:120,bls:96,clients:40,products:210}},
      activity:{[c1.id]:h(1),[c2.id]:h(50),[c3.id]:h(400)},
      pay:{[c1.id]:{amount:12000,paid_at:addPeriod(t,-3),method:'Virement',ref:'VIR-0425',note:'',period_end:c1.expires_at},[c3.id]:{amount:450,paid_at:addPeriod(t,-1),method:'Espèces',ref:'',note:'Reste 450 MAD',period_end:c3.expires_at}},
      log:[{id:1,at:now,actor_email:'vous (démo)',company_id:c2.id,company_name:c2.name,action:'Société créée',detail:{formule:'Essai'}}]};
  }
  let db;try{db=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
  if(!db)db=seed();
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};save();
  const co=id=>db.companies.find(c=>c.id===id);
  const act=cid=>db.members.filter(m=>m.company_id===cid&&m.active).length;
  const log=(cid,action,detail)=>{db.log.unshift({id:Date.now(),at:new Date().toISOString(),actor_email:'vous (démo)',company_id:cid,company_name:(co(cid)||{}).name||detail&&detail.nom,action,detail:detail||null});db.log=db.log.slice(0,200)};
  const ok=v=>new Promise(r=>setTimeout(()=>{save();r(v)},120));
  const fail=m=>Promise.reject(new Error(m));
  return {
    demo:true,
    async session(){return {email:'demo@tadbir'}},
    async logout(){},
    whoami:()=>ok({is_admin:true,email:'Mode démonstration'}),
    overview(){return ok({today:todayStr(),
      companies:db.companies.map(c=>Object.assign({},c,{active_users:act(c.id),total_users:db.members.filter(m=>m.company_id===c.id).length,invites:db.invitations.filter(i=>i.company_id===c.id).length,last_activity:db.activity[c.id]||null,last_login:db.members.filter(m=>m.company_id===c.id).map(m=>m.last_seen_at).filter(Boolean).sort().pop()||null})).sort((a,b)=>a.name.localeCompare(b.name)),
      unassigned:db.members.filter(m=>!m.company_id),log:db.log.slice(0,60)})},
    detail(id){const c=co(id);if(!c)return fail('Société introuvable.');return ok({company:Object.assign({},c),members:db.members.filter(m=>m.company_id===id),invitations:db.invitations.filter(i=>i.company_id===id),stats:db.stats[id]||{},last_activity:db.activity[id]||null,log:db.log.filter(l=>l.company_id===id).slice(0,40)})},
    saveCompany(p){
      if(!String(p.name||'').trim())return fail('La raison sociale est obligatoire.');
      const mx=parseInt(p.max_users,10)||3;if(mx<1)return fail('Le nombre maximum d’utilisateurs doit être au moins 1.');
      if(p.id){const c=co(p.id);if(!c)return fail('Société introuvable.');if(mx<act(c.id))return fail('Cette société a déjà '+act(c.id)+' utilisateurs actifs : désactivez-en avant de baisser la limite.');
        Object.assign(c,p,{max_users:mx,price_mad:Number(p.price_mad)||0,expires_at:p.expires_at||null});log(c.id,'Société modifiée',{formule:p.plan,max:mx,expire:p.expires_at});return ok(c.id)}
      const c=Object.assign({status:'active',created_at:new Date().toISOString()},p,{id:uid(),max_users:mx,price_mad:Number(p.price_mad)||0,expires_at:p.expires_at||null});
      db.companies.push(c);log(c.id,'Société créée',{formule:p.plan,max:mx,expire:p.expires_at});return ok(c.id)},
    setStatus(id,s){const c=co(id);c.status=s;log(id,s==='active'?'Accès réactivé':'Accès suspendu');return ok()},
    extend(id,m,d){const c=co(id);const base=(c.expires_at&&c.expires_at>todayStr())?c.expires_at:todayStr();c.expires_at=addPeriod(base,m,d);log(id,'Abonnement prolongé',{mois:m,jours:d||0,nouvelle_fin:c.expires_at});return ok(c.expires_at)},
    invite(cid,email,name,role){
      const em=String(email||'').trim().toLowerCase();if(!emailOk(em))return fail('Adresse e-mail invalide : '+email);
      const c=co(cid);const m=db.members.find(x=>String(x.email).toLowerCase()===em);
      if(m){if(m.company_id&&m.company_id!==cid)return fail('Cet e-mail utilise déjà une autre société.');if(m.company_id===cid&&m.active)return ok('deja_actif');
        m.company_id=cid;m.role=role;if(name)m.full_name=name;m.active=act(cid)<c.max_users;log(cid,'Compte existant rattaché',{email:em,role});return ok(m.active?'rattache':'rattache_inactif')}
      const i=db.invitations.find(x=>x.email===em);
      if(i&&i.company_id!==cid)return fail('Cet e-mail est déjà invité dans une autre société.');
      if(i){i.full_name=name;i.role=role}else db.invitations.push({id:uid(),company_id:cid,email:em,full_name:name||null,role,created_at:new Date().toISOString()});
      log(cid,'Invitation',{email:em,role});return ok('invite')},
    cancelInvite(id){const i=db.invitations.find(x=>x.id===id);db.invitations=db.invitations.filter(x=>x.id!==id);if(i)log(i.company_id,'Invitation annulée',{email:i.email});return ok()},
    simulateSignup(id){const i=db.invitations.find(x=>x.id===id);if(!i)return ok();const c=co(i.company_id);
      db.members.push({user_id:uid(),company_id:i.company_id,email:i.email,full_name:i.full_name||i.email,role:i.role,active:act(i.company_id)<c.max_users,created_at:new Date().toISOString(),last_seen_at:new Date().toISOString()});
      db.invitations=db.invitations.filter(x=>x.id!==id);return ok()},
    setMember(u,cid,role,active,name){const m=db.members.find(x=>x.user_id===u);if(!m)return fail('Utilisateur introuvable.');
      if(cid&&active&&(!m.active||m.company_id!==cid)){const c=co(cid);if(act(cid)>=c.max_users)return fail('Limite atteinte : '+c.max_users+' utilisateur(s) actif(s) maximum pour cette société.')}
      const old=m.company_id;m.company_id=cid;m.role=role;m.active=cid?active:false;if(name)m.full_name=name;
      log(cid||old,cid?'Utilisateur modifié':'Utilisateur retiré de la société',{email:m.email,role,actif:active});return ok()},
    deleteCompany(id,conf){const c=co(id);if(!c)return fail('Société introuvable.');if(String(conf||'').trim()!==c.name)return fail('Confirmation incorrecte : tapez exactement « '+c.name+' ».');
      log(id,'Société supprimée',{nom:c.name});db.members.forEach(m=>{if(m.company_id===id){m.company_id=null;m.active=false}});db.invitations=db.invitations.filter(i=>i.company_id!==id);db.companies=db.companies.filter(x=>x.id!==id);return ok()},
    getTabs(cid){db.tabs=db.tabs||{co:{},mem:{}};const mem={};db.members.filter(m=>m.company_id===cid).forEach(m=>{if(db.tabs.mem[m.user_id])mem[m.user_id]=db.tabs.mem[m.user_id]});return ok({company:db.tabs.co[cid]||null,members:mem})},
    setTabs(kind,id,tabs){db.tabs=db.tabs||{co:{},mem:{}};const box=kind==='company'?db.tabs.co:db.tabs.mem;if(tabs)box[id]=tabs;else delete box[id];
      const m=kind==='member'?db.members.find(x=>x.user_id===id):null;log(kind==='company'?id:(m&&m.company_id),'Onglets modifiés',{email:m&&m.email,onglets:tabs?tabs.length+' / '+ALL_TABS.length:'tous'});return ok()},
    getSettings(cid){db.settings=db.settings||{};const x=db.settings[cid]||{};return ok({company:x.company||null,tax:x.tax||null})},
    setSettings(cid,kind,obj){db.settings=db.settings||{};const x=db.settings[cid]=db.settings[cid]||{};x[kind]=JSON.parse(JSON.stringify(obj));log(cid,kind==='tax'?'Attestation fiscale modifiée':'Paramètres de la société modifiés');return ok()},
    reminders(){db.reminders=db.reminders||[];const out={},lim=Date.now()-30*864e5;db.reminders.forEach(r=>{const o=out[r.company_id]=out[r.company_id]||{last_at:null,channel:null,tone:null,count30:0,total:0};o.total++;if(new Date(r.at).getTime()>=lim)o.count30++;if(!o.last_at||r.at>o.last_at){o.last_at=r.at;o.channel=r.channel;o.tone=r.tone}});return ok(out)},
    addReminder(cid,channel,tone){db.reminders=db.reminders||[];db.reminders.push({company_id:cid,channel,tone,at:new Date().toISOString()});log(cid,'Relance envoyée',{canal:channel});return ok()},
    payments(){db.pay=db.pay||{};return ok(JSON.parse(JSON.stringify(db.pay)))},
    setPayment(cid,p){db.pay=db.pay||{};if(p)db.pay[cid]=Object.assign({},p,{updated_at:new Date().toISOString()});else delete db.pay[cid];
      log(cid,p?'Paiement enregistré':'Paiement annulé',p?{montant:p.amount,mode:p.method}:null);return ok()},
    reset(){localStorage.removeItem(K);db=seed();save()}
  };
}

function toast(m,err){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?5200:2600)}
async function run(btn,fn,okMsg){
  if(btn)btn.disabled=true;
  try{const r=await fn();if(okMsg)toast(okMsg);return r}
  catch(e){toast(e.message||String(e),true);throw e}
  finally{if(btn&&btn.isConnected)btn.disabled=false}
}

async function start(){
  const demo=localStorage.getItem('tadbir_console_mode')==='demo';
  if(demo){API=DemoAPI();ME={email:'demo'};return afterLogin()}
  const c=cfg();if(!c){setupView();return}
  API=SupabaseAPI(c);
  gate('<h2>Connexion…</h2><p>Connexion au serveur.</p>');
  try{ME=await API.session();if(ME)await afterLogin();else loginView()}
  catch(e){gate('<h2>Connexion impossible</h2><p>'+E(e.message)+'</p><button class="btn" id="rt">Réessayer</button><div class="glinks"><a href="#" id="rc">Changer de base</a></div>');$('#rt').onclick=start;$('#rc').onclick=ev=>{ev.preventDefault();localStorage.removeItem('tadbir_console_cfg');setupView()}}
}
async function afterLogin(){
  try{const w=await API.whoami();if(!w||!w.is_admin){notAdminView(w&&w.email||ME&&ME.email);return}ME.email=w.email}
  catch(e){gate('<h2>Base non préparée</h2><p>'+E(e.message)+'</p><p>Exécutez d’abord le script <b>Tadbir_Supabase_MultiSocietes.sql</b> dans Supabase › SQL Editor.</p><button class="btn" id="rt">Réessayer</button>');$('#rt').onclick=afterLogin;return}
  shell();await refresh();
}

const PAY_LS='tadbir_console_pay';
const PAY_METHODS=['Virement','Espèces','Chèque','Carte bancaire','Effet','Autre'];
const PAY_ST={paid:'Payé',part:'Partiel',unpaid:'Non payé',free:'Gratuit / essai'};
const TVA=0.20;
function payLocal(){try{return JSON.parse(localStorage.getItem(PAY_LS)||'{}')||{}}catch(e){return {}}}
function payLocalSet(cid,p){const x=payLocal();if(p)x[cid]=Object.assign({},p,{updated_at:new Date().toISOString()});else delete x[cid];try{localStorage.setItem(PAY_LS,JSON.stringify(x))}catch(e){}}
async function loadPay(){
  try{UI.pay=await API.payments()||{};UI.payErr=null}
  catch(e){UI.pay=payLocal();UI.payErr=e.message||String(e)}
}
async function savePay(cid,p){
  if(UI.payErr){payLocalSet(cid,p);UI.pay=payLocal();return}
  await API.setPayment(cid,p);
}
function payOf(c){
  const rec=(UI.pay||{})[c.id]||null,amount=Number(c.price_mad)||0,paid=rec?Number(rec.amount)||0:0,rest=Math.max(0,amount-paid);
  let k;if(amount<=0&&paid<=0)k='free';else if(paid>=amount)k='paid';else if(paid>0)k='part';else k='unpaid';
  return {rec,amount,paid,rest,k,t:PAY_ST[k]};
}
function payBadge(p){return '<span class="badge b-'+p.k+'">'+E(p.t)+'</span>'}
function totals(list){
  const t={n:list.length,amount:0,paid:0,rest:0,paidN:0,partN:0,unpaidN:0,freeN:0};
  list.forEach(c=>{const p=payOf(c);t.amount+=p.amount;t.paid+=Math.min(p.paid,p.amount||p.paid);t.rest+=p.rest;t[p.k+'N']++});
  return t;
}
function pct(a,b){return b>0?Math.round(100*a/b):0}
function stName(k){return {ok:'Active',soon:'Expire bientôt',exp:'Expirée',sus:'Suspendue'}[k]||k}

function renderInv(m){
  const all=OV.companies,f=UI.ipf||'all',fe=UI.ief||'all',q=(UI.iq||'').trim().toLowerCase(),so=UI.isort||'name';
  const list=all.filter(c=>{const p=payOf(c);
    if(f!=='all'&&p.k!==f)return false;
    if(fe!=='all'&&cState(c).k!==fe)return false;
    if(q&&!(c.name+' '+(c.city||'')+' '+(c.ice||'')+' '+(c.contact||'')+' '+(p.rec&&p.rec.ref||'')).toLowerCase().includes(q))return false;return true});
  const sorters={name:(a,b)=>a.name.localeCompare(b.name),end:(a,b)=>String(a.expires_at||'9999').localeCompare(String(b.expires_at||'9999')),
    start:(a,b)=>String(a.starts_at||'').localeCompare(String(b.starts_at||'')),amount:(a,b)=>payOf(b).amount-payOf(a).amount,rest:(a,b)=>payOf(b).rest-payOf(a).rest};
  list.sort(sorters[so]||sorters.name);
  const T=totals(all),L=totals(list);
  const act=all.filter(c=>['ok','soon'].includes(cState(c).k));
  const mrr=act.reduce((a,c)=>a+monthly(c),0);
  const cnt=k=>all.filter(c=>payOf(c).k===k).length;
  const chip=(k,t)=>'<button class="chip'+(f===k?' on':'')+'" data-pf="'+k+'">'+t+'</button>';

function invCsv(list,L){
  const n=v=>String(Math.round((Number(v)||0)*100)/100).replace('.',',');
  const q=v=>{const s=String(v==null?'':v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[['N°','Société','Forme juridique','Ville','ICE','Contact','Téléphone','Formule','Début','Fin','État','Montant HT','Payé','Reste','Statut paiement','Date paiement','Mode','Référence','Note']];
  list.forEach((c,i)=>{const p=payOf(c),r=p.rec||{};rows.push([i+1,c.name,c.legal_form,c.city,c.ice,c.contact,c.phone,c.plan,fd(c.starts_at),fd(c.expires_at),cState(c).t,n(p.amount),n(p.paid),n(p.rest),p.t,r.paid_at?fd(r.paid_at):'',r.method||'',r.ref||'',r.note||''])});
  rows.push([]);
  rows.push(['','TOTAL HT ('+L.n+' sociétés)','','','','','','','','','',n(L.amount),n(L.paid),n(L.rest),pct(L.paid,L.amount)+' % encaissé']);
  rows.push(['','TOTAL TTC (TVA '+Math.round(TVA*100)+' %)','','','','','','','','','',n(L.amount*(1+TVA)),n(L.paid*(1+TVA)),n(L.rest*(1+TVA))]);
  rows.push(['','Payées : '+L.paidN,'Partielles : '+L.partN,'Non payées : '+L.unpaidN,'Gratuites : '+L.freeN]);
  const csv='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='inventaire-societes-'+todayStr()+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Fichier exporté.');
}

function payBox(c){
  const p=payOf(c),r=p.rec||{};
  const body='<div class="row" style="margin-bottom:14px;gap:10px">'+payBadge(p)+'<span class="muted" style="font-size:13px">'+E(c.plan)+' · du '+fd(c.starts_at)+' au '+fd(c.expires_at)+' · montant <b>'+(p.amount?money(p.amount)+' MAD HT':'gratuit')+'</b></span></div>'
   +'<div class="fg">'
   +'<div class="field"><label>Montant payé (MAD)</label><input id="pyA" type="number" min="0" step="0.01" value="'+E(p.rec?p.paid:p.amount)+'"><small>'+(p.amount?'<a href="#" id="pyFull">Payé en totalité ('+money(p.amount)+')</a>':'Formule gratuite')+'</small></div>'
   +'<div class="field"><label>Date de paiement</label><input id="pyD" type="date" value="'+E(r.paid_at||todayStr())+'"></div>'
   +'<div class="field"><label>Mode de paiement</label><select id="pyM">'+PAY_METHODS.map(x=>'<option'+((r.method||'Virement')===x?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'
   +'<div class="field"><label>Référence</label><input id="pyR" value="'+E(r.ref||'')+'" placeholder="N° virement, chèque, reçu…"></div>'
   +'<div class="field full"><label>Note</label><input id="pyN" value="'+E(r.note||'')+'" placeholder="Facultatif"></div></div>'
   +'<div class="muted" id="pyInfo" style="margin-top:10px;font-size:13px"></div>'
   +(r.period_end&&r.period_end!==c.expires_at?'<div class="alert warn" style="margin-top:10px">Ce paiement avait été saisi pour la période se terminant le '+fd(r.period_end)+'. L’abonnement finit maintenant le '+fd(c.expires_at)+' : vérifiez s’il couvre la nouvelle période.</div>':'');
  const {o,close}=modal('Paiement — '+c.name,body,(p.rec?'<button type="button" class="btn danger" data-clr style="margin-inline-end:auto">Marquer non payé</button>':'')+'<button class="btn sec" data-c>Annuler</button><button class="btn" data-ok>Enregistrer</button>','md');
  const g=s=>o.querySelector(s);
  const info=()=>{const a=Number(g('#pyA').value)||0,rest=Math.max(0,p.amount-a);
    g('#pyInfo').innerHTML=p.amount?(a>=p.amount?'<b style="color:var(--grn)">Payé en totalité</b>'+(a>p.amount?' — '+money(a-p.amount)+' MAD en plus du prix':''):a>0?'<b style="color:var(--amb)">Paiement partiel</b> — reste '+money(rest)+' MAD HT':'<b style="color:var(--red)">Non payé</b>'):''};
  info();g('#pyA').oninput=info;
  const full=g('#pyFull');if(full)full.onclick=e=>{e.preventDefault();g('#pyA').value=p.amount;info()};
  g('[data-c]').onclick=close;
  const done=msg=>{toast(msg);close();return refresh()};
  const clr=g('[data-clr]');if(clr)clr.onclick=e=>run(e.currentTarget,()=>savePay(c.id,null)).then(()=>done('Paiement annulé : société marquée non payée.')).catch(()=>{});
  g('[data-ok]').onclick=e=>{const a=Number(g('#pyA').value);
    if(!(a>=0)){toast('Montant invalide.',true);g('#pyA').focus();return}
    if(a===0&&p.amount>0){run(e.currentTarget,()=>savePay(c.id,null)).then(()=>done('Société marquée non payée.')).catch(()=>{});return}
    if(!g('#pyD').value){toast('Saisissez la date de paiement.',true);return}
    const rec={amount:a,paid_at:g('#pyD').value,method:g('#pyM').value,ref:g('#pyR').value.trim(),note:g('#pyN').value.trim(),period_end:c.expires_at||null};
    run(e.currentTarget,()=>savePay(c.id,rec)).then(()=>done('Paiement enregistré.')).catch(()=>{})};
  setTimeout(()=>g('#pyA').select(),40);
}

function logList(l){
  if(!l.length)return '<div class="empty" style="padding:16px">Aucune action pour le moment.</div>';
  const det=d=>{if(!d)return '';const p=[];if(d.email)p.push(d.email);if(d.role)p.push(d.role);if(d.formule)p.push(d.formule);if(d.max)p.push(d.max+' util. max');if(d.nouvelle_fin)p.push('fin : '+fd(d.nouvelle_fin));else if(d.expire)p.push('fin : '+fd(d.expire));if(d.actif!=null)p.push(d.actif?'actif':'inactif');if(d.onglets)p.push('onglets : '+d.onglets);if(d.canal)p.push('par '+d.canal);if(d.montant!=null)p.push(money(d.montant)+' MAD');if(d.mode)p.push(d.mode);return p.join(' · ')};
  return '<div class="log">'+l.map(x=>'<div><time>'+fdt(x.at)+'</time><span><b>'+E(x.action)+'</b>'+(x.company_name?' — '+E(x.company_name):'')+'<br><small>'+E(det(x.detail))+(x.actor_email?' · par '+E(x.actor_email):'')+'</small></span></div>').join('')+'</div>';
}

   +'<li><div><b>Préparer la base</b>Supabase › SQL Editor › New query : collez tout le fichier <code>Tadbir_Supabase_MultiSocietes.sql</code> puis « Run ».</div></li>'
   +'<li><div><b>Activer les paramètres et les relances</b>Exécutez aussi <code>Tadbir_Parametres_Relances.sql</code> (une seule fois). Il permet de modifier les informations des sociétés (adresse, ICE, logo, cachet…) et garde l’historique des relances.</div></li>'
   +'<li><div><b>Activer l’inventaire des paiements</b>Exécutez aussi <code>Tadbir_Inventaire.sql</code> (une seule fois). Il enregistre dans la base le statut payé / non payé de chaque société, visible depuis tous vos appareils.</div></li>'
   +'<li><div><b>Activer les onglets par société et par utilisateur</b>Dans le SQL Editor, exécutez aussi le fichier <code>Tadbir_Onglets.sql</code> (une seule fois). Il ajoute le réglage « Onglets » utilisé par la console et l’application.</div></li>'
   +'<li><div><b>Relier la console et l’application</b>Supabase › Project Settings › API : copiez « Project URL » et la clé « anon public ». Collez-les dans cette console (écran de connexion) et dans l’application, en haut du fichier : <code>BSM_CLOUD_CONFIG={url:"…",anonKey:"…"}</code>.</div></li>'
   +'<li><div><b>Devenir super-administrateur</b>Créez votre compte dans Supabase › Authentication › Users (« Add user »), connectez-vous à cette console, puis exécutez une fois la commande affichée à l’écran dans le SQL Editor.</div></li>'
   +'<li><div><b>Créer une société cliente</b>« Nouvelle société » : identité, formule, date de fin, nombre maximum d’utilisateurs, et les e-mails des personnes à inviter.</div></li>'
   +'<li><div><b>Les employés s’inscrivent</b>Chacun ouvre l’application et clique « Créer un compte employé » avec l’e-mail invité : il entre directement dans sa société.</div></li>'
   +'</ol></div></div>'
   +'<div class="card" style="margin-top:16px"><div class="card-h"><h3>Apparence de la console</h3><small>choix enregistré sur cet appareil</small></div><div class="card-b">'+tbTiles()+'</div></div>'
   +'<div class="card" style="margin-top:16px"><div class="card-h"><h3>Connexion actuelle</h3></div><div class="card-b">'
   +(API.demo?'<span class="muted">Mode démonstration — aucune base reliée.</span>':'<div class="info"><div><span>Project URL</span><b>'+E(c&&c.url)+'</b></div><div><span>Compte</span><b>'+E(ME.email)+'</b></div></div>')
   +'<div class="row" style="margin-top:14px">'+(API.demo?'<button class="btn" id="bReal">Relier une vraie base Supabase</button>':(!c||!c.fixed?'<button class="btn sec" id="bChg">Changer de base</button>':''))+'</div>'
   +'<div class="alert info" style="margin-top:14px">Sécurité : publiez cette console à une adresse séparée (ex. <code>admin.bsmelevator.com</code>) et ne la donnez à personne. Même si quelqu’un l’ouvre, il ne peut rien faire sans un compte super-administrateur.</div></div></div>';
  const r=$('#bReset');if(r)r.onclick=()=>confirmBox('Réinitialiser la démo ?','Les données fictives reviennent à leur état de départ.','Réinitialiser',async()=>{API.reset();await refresh();toast('Démo réinitialisée.')});
  const rl=$('#bReal');if(rl)rl.onclick=()=>{localStorage.removeItem('tadbir_console_mode');start()};
  const ch=$('#bChg');if(ch)ch.onclick=()=>confirmBox('Changer de base ?','Vous serez déconnecté et devrez saisir une nouvelle adresse Supabase.','Changer',async()=>{await API.logout();localStorage.removeItem('tadbir_console_cfg');setupView()});
}

/* =====================================================================
   Fenêtres
   ===================================================================== */
function modal(title,body,foot,cls){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML='<div class="modal '+(cls||'')+'" role="dialog" aria-modal="true"><div class="mh"><h3>'+E(title)+'</h3><button type="button" aria-label="Fermer">×</button></div><div class="mb">'+body+'</div><div class="mf">'+foot+'</div></div>';
  document.body.appendChild(o);
  const close=()=>o.remove();o.querySelector('.mh button').onclick=close;
  o.addEventListener('mousedown',e=>{if(e.target===o)close()});
  return {o,close};
}
function confirmBox(title,text,label,fn){
  const {o,close}=modal(title,'<p style="margin:0">'+E(text)+'</p>','<button class="btn sec" data-c>Annuler</button><button class="btn danger" data-ok>'+E(label)+'</button>','sm');
  o.querySelector('[data-c]').onclick=close;
  o.querySelector('[data-ok]').onclick=async e=>{e.currentTarget.disabled=true;try{await fn();close()}catch(x){toast(x.message||String(x),true);e.currentTarget.disabled=false}};
}
function deleteBox(c){
  const {o,close}=modal('Supprimer définitivement ?','<div class="alert err" style="margin-bottom:14px">Toutes les données de <b>'+E(c.name)+'</b> seront effacées : factures, BL, stock, clients, paie… Cette action est irréversible.</div><div class="field"><label>Pour confirmer, tapez le nom exact : '+E(c.name)+'</label><input id="dC" autocomplete="off"></div>','<button class="btn sec" data-c>Annuler</button><button class="btn danger" data-ok disabled>Supprimer</button>','sm');
  const i=o.querySelector('#dC'),b=o.querySelector('[data-ok]');
  i.oninput=()=>{b.disabled=i.value.trim()!==c.name};
  o.querySelector('[data-c]').onclick=close;
  b.onclick=()=>run(b,()=>API.deleteCompany(c.id,i.value),'Société supprimée.').then(()=>{close();UI.coId=null;DET=null;UI.page='cos';refresh()}).catch(()=>{});
  i.focus();
}

/* ---------- onglets (société / utilisateur) ---------- */
function coTabs(){return DET&&DET.tabs?DET.tabs.company:null}
function memTabs(uid){return DET&&DET.tabs&&DET.tabs.members?DET.tabs.members[uid]||null:null}
function tabCount(list){return (list?list.filter(t=>ALL_TABS.includes(t)).length:ALL_TABS.length)+' / '+ALL_TABS.length}
function memTabLabel(uid){const own=memTabs(uid);if(!own)return 'Société';const co=coTabs()||ALL_TABS;return own.filter(t=>co.includes(t)).length+' / '+co.length}
function tabsReady(){if(DET&&DET.tabs)return true;
  toast(API.demo?'Onglets indisponibles.':'Exécutez d’abord le script Tadbir_Onglets.sql dans Supabase › SQL Editor (voir « Installation »).',true);return false}
function companyTabsBox(c){if(!tabsReady())return;
  tabsBox({title:'Onglets — '+c.name,sub:'Onglets visibles pour <b>tous les utilisateurs</b> de cette société. Un onglet retiré ici disparaît pour tout le monde.',
    universe:ALL_TABS,cur:coTabs(),resetLabel:'Tout afficher',
    save:list=>API.setTabs('company',c.id,list),okMsg:'Onglets de la société enregistrés.'})}
function memberTabsBox(c,u){if(!tabsReady())return;
  const uni=(coTabs()||ALL_TABS).filter(t=>ALL_TABS.includes(t));
  tabsBox({title:'Onglets — '+(u.full_name||u.email),sub:'Onglets visibles pour <b>'+E(u.email)+'</b>. Seuls les onglets ouverts pour '+E(c.name)+' peuvent être ajoutés.',
    universe:uni,cur:memTabs(u.user_id),resetLabel:'Reprendre les onglets de la société',
    save:list=>API.setTabs('member',u.user_id,list),okMsg:'Onglets de l’utilisateur enregistrés.'})}
function tabsBox(o){
  const uni=o.universe.slice();LOCKED_TABS.forEach(t=>{if(!uni.includes(t))uni.unshift(t)});
  let sel=new Set((o.cur||uni).filter(t=>uni.includes(t)));LOCKED_TABS.forEach(t=>sel.add(t));
  let addOpen=false;
  const groups=()=>TAB_GROUPS.map(g=>[g[0],g[1].filter(t=>uni.includes(t[0]))]).filter(g=>g[1].length);
  const {o:ov,close}=modal(o.title,'<div id="tbx"></div>','<button type="button" class="lnk" data-reset>'+E(o.resetLabel)+'</button><button class="btn sec" data-c>Annuler</button><button class="btn" data-ok>Enregistrer</button>','md');
  const box=ov.querySelector('#tbx');
  function draw(){
    const shown=groups().map(g=>{const on=g[1].filter(t=>sel.has(t[0]));
      return '<div class="tg"><div class="tg-h">'+E(g[0])+' <small>'+on.length+' / '+g[1].length+'</small>'+(on.some(t=>!LOCKED_TABS.includes(t[0]))?'<button type="button" data-gx="'+E(g[0])+'">Tout retirer</button>':'')+'</div><div class="tg-c">'
        +(on.length?on.map(t=>LOCKED_TABS.includes(t[0])?'<span class="tchip lock" title="Toujours affiché">'+E(t[1])+'</span>':'<span class="tchip">'+E(t[1])+'<button type="button" data-x="'+t[0]+'" aria-label="Retirer '+E(t[1])+'" title="Retirer">×</button></span>').join(''):'<span class="tg-empty">Aucun onglet de ce groupe.</span>')+'</div></div>'}).join('');
    const hid=groups().map(g=>[g[0],g[1].filter(t=>!sel.has(t[0]))]).filter(g=>g[1].length);
    const nHid=hid.reduce((a,g)=>a+g[1].length,0);
    box.innerHTML='<p class="muted" style="margin:0 0 12px;font-size:13px">'+o.sub+'</p>'
      +'<div class="tsum"><b>'+sel.size+' / '+uni.length+'</b><span class="muted">onglets affichés</span><span class="spacer"></span>'
      +'<button type="button" class="btn sec sm" data-add'+(nHid?'':' disabled')+'>'+ICON.plus+(addOpen?'Fermer l’ajout':'Ajouter un onglet'+(nHid?' ('+nHid+')':''))+'</button></div>'
      +(addOpen&&nHid?'<div class="addp" style="margin-bottom:12px"><div class="row" style="margin-bottom:8px"><b style="font-size:13px">Onglets masqués</b><span class="spacer"></span><button type="button" class="btn sec sm" data-all>Tout ajouter</button></div>'
        +hid.map(g=>'<div class="tg"><div class="tg-h">'+E(g[0])+'</div><div class="tg-c">'+g[1].map(t=>'<button type="button" class="tadd" data-a="'+t[0]+'">+ '+E(t[1])+'</button>').join('')+'</div></div>').join('')+'</div>':'')
      +shown;
    box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{sel.delete(b.dataset.x);draw()});
    box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{sel.add(b.dataset.a);if(!groups().some(g=>g[1].some(t=>!sel.has(t[0]))))addOpen=false;draw()});
    box.querySelectorAll('[data-gx]').forEach(b=>b.onclick=()=>{const g=groups().find(x=>x[0]===b.dataset.gx);g[1].forEach(t=>{if(!LOCKED_TABS.includes(t[0]))sel.delete(t[0])});draw()});
    const ad=box.querySelector('[data-add]');if(ad)ad.onclick=()=>{addOpen=!addOpen;draw()};
    const al=box.querySelector('[data-all]');if(al)al.onclick=()=>{uni.forEach(t=>sel.add(t));addOpen=false;draw()};
  }
  draw();
  ov.querySelector('[data-c]').onclick=close;
  ov.querySelector('[data-reset]').onclick=()=>{uni.forEach(t=>sel.add(t));addOpen=false;draw()};
  ov.querySelector('[data-ok]').onclick=e=>{
    const list=ALL_TABS.filter(t=>sel.has(t));
    const full=uni.every(t=>sel.has(t));
    run(e.currentTarget,()=>o.save(full?null:list),o.okMsg).then(()=>{close();return refresh()}).catch(()=>{});
  };
}

function companyForm(c){
  const isNew=!c;c=c||{plan:'Mensuel',max_users:3,starts_at:todayStr(),price_mad:''};
  if(isNew)c.expires_at=addPeriod(c.starts_at,1,0);
  const fld=(k,l,t,ph,cls)=>'<div class="field '+(cls||'')+'"><label>'+l+'</label><input id="f_'+k+'" type="'+(t||'text')+'" value="'+E(c[k]==null?'':c[k])+'" placeholder="'+E(ph||'')+'"></div>';
  const urow=(r)=>'<div class="urow"><input class="inp ur-n" placeholder="Nom complet"><input class="inp ur-e" type="email" placeholder="e-mail@societe.ma"><select class="inp ur-r">'+ROLES.map(x=>'<option'+(x===r?' selected':'')+'>'+x+'</option>').join('')+'</select><button type="button" class="ur-x" title="Retirer">×</button></div>';
  const body='<div class="sect">Identité</div><div class="fg">'
    +fld('name','Raison sociale *','text','Ex. ATLAS LIFT','full')+fld('legal_form','Forme juridique','text','SARL, SA, SARL AU…')+fld('city','Ville')
    +fld('ice','ICE')+fld('if_num','Identifiant fiscal (IF)')+fld('rc','Registre de commerce (RC)')+fld('cnss','CNSS')
    +fld('phone','Téléphone','tel')+fld('email','E-mail','email')+fld('contact','Personne à contacter')+fld('address','Adresse','text','','full')+'</div>'
    +'<div class="sect">Abonnement</div><div class="fg">'
    +'<div class="field"><label>Formule</label><select id="f_plan">'+Object.keys(PLANS).map(k=>'<option value="'+k+'"'+(c.plan===k?' selected':'')+'>'+PLANS[k].label+'</option>').join('')+'</select></div>'
    +fld('price_mad','Prix (MAD HT, par période)','number','0')
    +'<div class="field"><label>Nombre maximum d’utilisateurs</label><input id="f_max_users" type="number" min="1" step="1" value="'+E(c.max_users)+'"><small>Comptes actifs en même temps.</small></div><div></div>'
    +fld('starts_at','Début','date')
    +'<div class="field"><label>Fin d’abonnement</label><input id="f_expires_at" type="date" value="'+E(c.expires_at||'')+'"><small id="expHint">Calculée selon la formule, modifiable.</small></div>'
    +'<div class="field full"><label>Notes internes</label><textarea id="f_notes" rows="2" placeholder="Paiement, contrat, contact…">'+E(c.notes||'')+'</textarea></div></div>'
    +(isNew?'<div class="sect">Utilisateurs à inviter</div><p class="muted" style="margin:-4px 0 10px;font-size:13px">Ils s’inscriront dans l’application avec ces e-mails et seront rattachés automatiquement. Lignes vides ignorées.</p><div id="urows">'+urow('Administrateur')+urow('Employé')+urow('Employé')+'</div><button type="button" class="btn sec sm" id="addU">'+ICON.plus+'Ajouter une personne</button>':'');
  const {o,close}=modal(isNew?'Nouvelle société cliente':'Modifier — '+c.name,body,'<button class="btn sec" data-c>Annuler</button><button class="btn" data-ok>'+(isNew?'Créer la société':'Enregistrer')+'</button>');
  const g=k=>o.querySelector('#f_'+k);
  const recalc=()=>{const p=PLANS[g('plan').value];g('expires_at').value=addPeriod(g('starts_at').value||todayStr(),p.months,p.days)};
  g('plan').onchange=recalc;g('starts_at').onchange=recalc;
  o.querySelector('[data-c]').onclick=close;
  const bindX=()=>o.querySelectorAll('.ur-x').forEach(b=>b.onclick=()=>b.parentElement.remove());
  if(isNew){bindX();o.querySelector('#addU').onclick=()=>{o.querySelector('#urows').insertAdjacentHTML('beforeend',urow('Employé'));bindX()}}
  o.querySelector('[data-ok]').onclick=async e=>{
    const p={id:isNew?null:c.id};['name','legal_form','city','ice','if_num','rc','cnss','phone','email','contact','address','plan','price_mad','max_users','starts_at','expires_at','notes'].forEach(k=>p[k]=String(g(k).value||'').trim());
    if(!p.name){toast('La raison sociale est obligatoire.',true);g('name').focus();return}
    const mx=parseInt(p.max_users,10);if(!(mx>=1)){toast('Le nombre maximum d’utilisateurs doit être au moins 1.',true);return}
    if(p.expires_at&&p.starts_at&&p.expires_at<p.starts_at){toast('La date de fin est avant la date de début.',true);return}
    let users=[];
    if(isNew){users=[...o.querySelectorAll('.urow')].map(r=>({n:r.querySelector('.ur-n').value.trim(),e:r.querySelector('.ur-e').value.trim(),r:r.querySelector('.ur-r').value})).filter(u=>u.e||u.n);
      const bad=users.find(u=>!emailOk(u.e));if(bad){toast('E-mail manquant ou invalide pour « '+(bad.n||bad.e)+' ».',true);return}
      const seen={};for(const u of users){const k=u.e.toLowerCase();if(seen[k]){toast('E-mail en double : '+u.e,true);return}seen[k]=1}
      if(users.length>mx){toast(users.length+' personnes invitées pour '+mx+' place(s) : augmentez le maximum ou retirez des lignes.',true);return}}
    const b=e.currentTarget;b.disabled=true;
    try{
      const id=await API.saveCompany(p);
      const errs=[];for(const u of users){try{await API.invite(id,u.e,u.n,u.r)}catch(x){errs.push(u.e+' : '+x.message)}}
      close();toast(isNew?'Société créée'+(users.length?' — '+(users.length-errs.length)+' invitation(s) envoyée(s).':'.'):'Modifications enregistrées.');
      if(errs.length)setTimeout(()=>toast(errs.join(' | '),true),900);
      UI.coId=id;UI.tab='users';await refresh();window.scrollTo(0,0);
    }catch(x){toast(x.message||String(x),true);b.disabled=false}
  };
  setTimeout(()=>g('name').focus(),40);
}

addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.querySelector('.ov:last-of-type');if(o)o.remove()}});
start();
})();

  /* petits tableaux récapitulatifs : restent en tableau compact */

  table.sumt th,table.sumt td{padding:8px 7px!important;font-size:12.5px;white-space:nowrap}

  /* ---------- fiche société ---------- */
  .dh{padding:16px!important;gap:14px!important}
  .dh h2{font-size:21px!important}
  .dh>.row{width:100%;display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
  .dh>.row .btn{justify-content:center;padding:10px 8px!important;border-radius:11px}
  .dh>.row .btn[data-x=edit]{grid-column:1/-1;order:-1}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .facts div{padding:12px 16px!important}
  .tabs{padding:0 8px!important;scrollbar-width:none;position:sticky;top:calc(58px + env(safe-area-inset-top));background:#fff;z-index:5;border-radius:16px 16px 0 0}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{padding:14px 10px!important}
  .info{grid-template-columns:1fr 1fr!important;gap:12px 14px!important}
  .stats,.rec{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #fInv{display:grid!important;grid-template-columns:1fr;gap:10px!important}
  #fInv .field{min-width:0!important}
  #fInv .btn{justify-content:center;padding:12px}
  .fg{grid-template-columns:1fr!important}
  .imgs{grid-template-columns:1fr 1fr!important}
  .savebar .btn{flex:1;justify-content:center;padding:12px}
  .log div{grid-template-columns:1fr!important;gap:2px!important}

  /* ---------- fenêtres → panneaux du bas ---------- */
  .ov{align-items:flex-end!important;padding:0!important;animation:mfade .15s ease}
  .ov .modal{width:100%!important;max-width:100%!important;border-radius:22px 22px 0 0!important;max-height:92vh;display:flex;flex-direction:column;animation:mup .24s cubic-bezier(.2,.8,.2,1)}
  .ov .mh{padding:16px 18px 12px!important;position:relative}
  .ov .mh::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:9px;background:#cbd5e1}
  .ov .mh h3{font-size:17px!important;padding-top:6px}
  .ov .mb{padding:14px 18px!important;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
  .ov .mf{padding:12px 18px calc(12px + env(safe-area-inset-bottom))!important;border-radius:0!important;flex-wrap:wrap}
  .ov .mf .btn{flex:1 1 auto;justify-content:center;padding:12px}
  .ov .mf .lnk{flex:1 1 100%;text-align:center;margin:0 0 4px!important}
  .urow{grid-template-columns:1fr 1fr!important}
  .urow .ur-e{grid-column:1/-1;order:-1}

  .toast{bottom:calc(84px + env(safe-area-inset-bottom))!important;border-radius:14px!important;text-align:center}
  .empty{padding:28px 16px!important}
  .main b,.main small,.main td,.main span,.info b{overflow-wrap:anywhere}
  .code{white-space:pre-wrap;word-break:break-all}
}
