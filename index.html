<script id="tb-mobile-js">
/* Tadbir Console — Version mobile : construction de la barre du haut, des onglets du bas
   et transformation automatique des tableaux en fiches. Aucune fonction existante modifiée. */
(function(){
'use strict';
var MQ=window.matchMedia('(max-width:820px)');
var IC={
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  cos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4"/></svg>',
  inv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M8 12h8M8 16h5"/></svg>',
  rel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  pend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  setup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>'
};
var LOGO='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 1.5l16 9.25v18.5L20 38.5 4 29.25v-18.5z" fill="#0e3a4a" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/><path d="M12.5 14h15M20 14v13" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><circle cx="27" cy="25.5" r="2" fill="#22d3ee"/></svg>';
var TABS=[['dash','Accueil'],['cos','Sociétés'],['inv','Inventaire'],['rel','Relances'],['more','Plus']];
var MORE=['pend','log','setup'];
function $(s,r){return (r||document).querySelector(s)}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function navBtn(p){return $('#nav [data-p="'+p+'"]')}
function go(p){var b=navBtn(p);if(b){b.click();window.scrollTo(0,0)}}
function cnt(id){var x=$('#'+id);return x&&!x.classList.contains('hide')?(x.textContent||'').trim():''}
function who(){var f=$('.sidefoot b');return f?f.textContent.trim():''}
function isDemo(){return !!$('.sidefoot .demo-tag')}

function build(){
  var sh=$('.shell');if(!sh||$('#mtop',sh))return;
  var top=document.createElement('header');top.id='mtop';
  top.innerHTML='<div class="mlogo">'+LOGO+'</div><div class="mtt"><small class="clk-m">'+(window.tbClock?window.tbClock():'Tadbir · Console')+'</small><b id="mttl">Tableau de bord</b></div>'+(isDemo()?'<span class="mdemo">DÉMO</span>':'')+'<button class="mav" id="mav" aria-label="Compte">'+E((who()||'?').charAt(0))+'</button>';
  sh.insertBefore(top,sh.firstChild);
  var tab=document.createElement('nav');tab.id='mtab';tab.setAttribute('aria-label','Navigation');
  tab.innerHTML=TABS.map(function(t){return '<button data-mp="'+t[0]+'">'+IC[t[0]]+'<span>'+t[1]+'</span></button>'}).join('');
  sh.appendChild(tab);
  tab.onclick=function(e){var b=e.target.closest('button');if(!b)return;var p=b.dataset.mp;if(p==='more')sheet();else go(p)};
  $('#mav').onclick=function(){sheet()};
  sync();
}
function sheet(){
  close();
  var ov=document.createElement('div');ov.className='msheet-ov';
  var lab=function(p){var b=navBtn(p);return b?(b.querySelector('span')||b).textContent.trim():p};
  var em=who();
  ov.innerHTML='<div class="msheet" role="dialog" aria-modal="true"><div class="grab"></div>'
    +'<div class="who"><div class="mav">'+E((em||'?').charAt(0))+'</div><div><b>'+E(em||'Compte')+'</b><small>'+(isDemo()?'Mode démonstration':'Super-administrateur')+'</small></div></div>'
    +(window.tbSwatches?'<div class="msw"><span>Thème</span>'+window.tbSwatches()+'</div>':'')
    +MORE.map(function(p){var c=p==='pend'?cnt('cntP'):'';return '<button class="mi" data-go="'+p+'">'+IC[p]+'<span>'+E(lab(p))+'</span>'+(c?'<i>'+E(c)+'</i>':'')+'</button>'}).join('')
    +'<button class="mi out" data-out>'+IC.out+'<span>'+(isDemo()?'Quitter la démo':'Se déconnecter')+'</span></button></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov){close();return}
    var g=e.target.closest('[data-go]');if(g){close();go(g.dataset.go);return}
    if(e.target.closest('[data-out]')){close();var o=$('#bOut');if(o)o.click()}});
}
function close(){document.querySelectorAll('.msheet-ov').forEach(function(x){x.remove()})}

function sync(){
  var t=$('#mtab');if(!t)return;
  var on=$('#nav button.on'),p=on?on.dataset.p:'dash';
  t.querySelectorAll('button').forEach(function(b){var mp=b.dataset.mp;b.classList.toggle('on',mp===p||(mp==='more'&&MORE.indexOf(p)>=0))});
  var badges={inv:cnt('cntI'),rel:cnt('cntR'),more:cnt('cntP')};
  t.querySelectorAll('button').forEach(function(b){var c=badges[b.dataset.mp],i=b.querySelector('i');if(c){if(!i){i=document.createElement('i');b.appendChild(i)}if(i.textContent!==c)i.textContent=c}else if(i)i.remove()});
  var h=$('#main .head h1')||$('#main .dh h2'),tt=$('#mttl');
  var nt=h?h.textContent.trim():(on?(on.querySelector('span')||on).textContent.trim():'Console');if(tt&&tt.textContent!==nt)tt.textContent=nt;
}

/* Tableaux → fiches : étiquette de colonne sur chaque cellule */
function cards(){
  document.querySelectorAll('#main .tw table').forEach(function(tb){
    if(tb.classList.contains('sumt'))return;
    var ths=tb.querySelectorAll('thead th'),labels=[];
    ths.forEach(function(th){var span=+th.getAttribute('colspan')||1;for(var k=0;k<span;k++)labels.push(th.textContent.trim())});
    tb.classList.add('mcards');
    tb.querySelectorAll('tbody tr, tfoot tr').forEach(function(tr){
      var i=0,first=true;
      Array.prototype.forEach.call(tr.children,function(td){
        var span=+td.getAttribute('colspan')||1,l=labels[i]||'';i+=span;
        if(td.hasAttribute('data-label'))return;
        var txt=td.textContent.trim(),hasBtn=!!td.querySelector('button,.btn'),hasField=!!td.querySelector('input,select');
        if(tr.parentNode.tagName==='TBODY'&&first&&(td.classList.contains('nm')||td.querySelector('b'))&&!hasField){td.classList.add('mtitle');first=false;td.setAttribute('data-label','');return}
        if(/^N°$/.test(l)&&tr.parentNode.tagName==='TBODY'){td.classList.add('mnum');td.setAttribute('data-label','');return}
        if(!txt&&!hasBtn&&!hasField){td.classList.add('mempty');td.setAttribute('data-label','');return}
        if(hasBtn&&!hasField&&!l){td.classList.add('mact');td.setAttribute('data-label','');return}
        td.setAttribute('data-label',l);if(l||txt)first=false;
      });
    });
  });
}
var raf=0;
function outCard(){
  var on=$('#nav button.on'),m=$('#main');if(!m||!on||on.dataset.p!=='setup'||$('#mOutCard'))return;
  var demo=isDemo(),c=document.createElement('div');c.className='card';c.id='mOutCard';
  c.innerHTML='<div class="card-b"><div class="mo-ic">'+IC.out+'</div><div class="mo-t"><b>'+(demo?'Quitter le mode démonstration':'Déconnexion')+'</b><small>Connecté : '+E(who()||'—')+'. '+(demo?'Revenir à l’écran de connexion.':'Fermez votre session sur cet appareil, surtout s’il est partagé.')+'</small></div>'
   +'<button class="btn" id="mOutBtn" type="button">'+IC.out+(demo?'Quitter la démo':'Se déconnecter')+'</button></div>';
  m.appendChild(c);
  $('#mOutBtn').onclick=function(){var o=$('#bOut');if(o)o.click()};
}
function refreshUI(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;outCard();if(!MQ.matches)return;build();cards();sync()})}
new MutationObserver(refreshUI).observe(document.getElementById('root')||document.body,{childList:true,subtree:true});
(MQ.addEventListener?MQ.addEventListener('change',refreshUI):MQ.addListener(refreshUI));
refreshUI();
})();
</script>

  --side:linear-gradient(180deg,#1c1917 0%,#292524 100%);--side-ink:#d6d3d1;--side-mut:#a8a29e;--top:linear-gradient(135deg,#1c1917,#44403c)}
html[data-theme=graphite]{--blue:#18181b;--acc:#18181b;--cyan:#18181b;--blue2:#f4f4f5;--acc2:#f4f4f5;--acc-ink:#18181b;--focus:#d4d4d8;--navy:#18181b;--bg:#fafafa;--line:#e4e4e7;
  --side:#fff;--side-ink:#52525b;--side-hi:#09090b;--side-mut:#a1a1aa;--side-line:#e4e4e7;--side-hover:#f4f4f5;--side-on:#f4f4f5;--top:#18181b}
html[data-theme=nuit]{color-scheme:dark;--ink:#e2e8f0;--ink2:#cbd5e1;--mut:#94a3b8;--line:#243049;--bg:#0b1120;--card:#111a2e;--navy:#334155;
  --blue:#0891b2;--acc:#0ea5c6;--cyan:#22d3ee;--blue2:rgba(34,211,238,.13);--acc2:rgba(34,211,238,.13);--acc-ink:#67e8f9;--focus:#155e75;--hover:#16213a;--soft:#1a2438;
  --red:#f87171;--red2:rgba(248,113,113,.14);--amb:#fbbf24;--amb2:rgba(251,191,36,.14);--grn:#4ade80;--grn2:rgba(74,222,128,.14);
  --side:#0a0f1c;--side-line:#1e293b;--top:linear-gradient(135deg,#0a0f1c,#0f2a35);--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6)}

/* ---- éléments reliés aux thèmes ---- */
.side{background:var(--side);color:var(--side-ink)}
html[data-theme=graphite] .side{border-inline-end:1px solid var(--line)}
.brand b{color:var(--side-hi)}.brand small{color:var(--side-mut)}
.nav button{color:var(--side-ink);transition:background .15s,color .15s}
.nav button:hover{background:var(--side-hover);color:var(--side-hi)}
.nav button.on{background:var(--side-on);color:var(--side-hi);box-shadow:inset 3px 0 0 var(--cyan)}
.sidefoot{border-top-color:var(--side-line);color:var(--side-mut)}.sidefoot b{color:var(--side-hi)}
.tchip,.tchip button,.alert.info{color:var(--acc-ink)}
.tbtn i{background:var(--blue2);color:var(--acc-ink)}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus,.rmsg:focus,.gbox .field input:focus{outline-color:var(--focus);border-color:var(--blue)}
.head h1,.dh h2{font-family:Sora,Inter,sans-serif;letter-spacing:-.015em}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--acc);opacity:.8}
.btn{transition:background .15s,filter .15s,border-color .15s}
.gate{background:var(--side)}
.gbox .btn{background:var(--blue)}.gbox .btn:hover{background:var(--blue);filter:brightness(.9)}
.gbrand .tb-w::after{color:var(--cyan)}
html[data-theme=graphite] .gate{background:#f4f4f5}
html[data-theme=graphite] .gbox{border:1px solid #e4e4e7;box-shadow:0 20px 50px -24px rgba(0,0,0,.25)}
html[data-theme=graphite] .gfoot{color:#71717a}
html[data-theme=graphite] .gbrand .tb-w::after{color:#06b6d4}

/* ---- bouton Se déconnecter (sous le dernier onglet) ---- */
.side-out{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:11px;margin-top:12px;padding:10px 12px;border-radius:10px;
  background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.28);color:#fca5a5;font-weight:650;font-size:14px;transition:background .15s,color .15s,border-color .15s,transform .1s}
.side-out svg{width:18px;height:18px;flex:none;opacity:.9}
.side-out:hover{background:rgba(248,113,113,.16);border-color:rgba(248,113,113,.5);color:#fecaca}
html[data-theme=graphite] .side-out{background:#fff;border-color:#fecaca;color:#dc2626}
html[data-theme=graphite] .side-out:hover{background:#fef2f2;border-color:#fca5a5;color:#b91c1c}
.side-out:active{transform:translateY(1px)}
.side-out:focus-visible{outline:2px solid #fca5a5;outline-offset:2px}

/* ---- sélecteur de thème ---- */
.thm{margin-top:12px}
.thm>span{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:8px;color:var(--side-mut)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw>button{all:unset;box-sizing:border-box;cursor:pointer;width:22px;height:22px;margin:0;border-radius:50%;box-shadow:0 0 0 1px rgba(148,163,184,.55);transition:transform .12s}
.sw>button:hover{transform:scale(1.13)}
.sw>button.on{outline:2px solid var(--side-hi);outline-offset:2px}
.thg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.thtile{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--card);display:grid;gap:8px;transition:border-color .15s,box-shadow .15s}
.thtile:hover{border-color:var(--blue)}
.thtile.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
.thpv{height:80px;border-radius:9px;display:grid;grid-template-columns:28% 1fr;overflow:hidden;border:1px solid rgba(148,163,184,.35)}
.thpv i{display:block;border-inline-end:1px solid rgba(148,163,184,.25)}
.thpv>span{display:grid;gap:7px;align-content:start;padding:10px}
.thpv em{display:block;height:8px;border-radius:4px;background:rgba(148,163,184,.4)}
.thpv u{display:block;width:46%;height:15px;border-radius:5px;margin-top:3px}
.thn{display:flex;justify-content:space-between;align-items:center}
.thtile b{font-size:14px;color:var(--ink)}
.thtile.on .thn::after{content:"✓";color:var(--blue);font-weight:800}
.thtile small{color:var(--mut);font-size:12px;margin-top:-4px}
.msheet .msw{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.msheet .msw>span{font-weight:600;font-size:15px;color:var(--ink)}
.msheet .sw>button{width:28px;height:28px}
.msheet .sw>button.on{outline-color:var(--ink)}
@media (max-width:820px){.thg{grid-template-columns:1fr 1fr}}

/* ---- version mobile reliée aux thèmes ---- */
#mtop{background:var(--top)}
#mtop .mtt small{color:rgba(255,255,255,.7)}
#mtab button.on{color:var(--blue)}#mtab button.on::before{background:var(--cyan)}
#mtab button:active{background:var(--blue2)}
.head .row .btn[data-act=new]{background:var(--blue)}
.msheet .mi svg{color:var(--blue)}
.msheet .who .mav{background:var(--blue)}

/* ---- mode sombre « Nuit » : surfaces ---- */
html[data-theme=nuit] body{background:var(--bg)}
html[data-theme=nuit] td{border-bottom-color:var(--line)}
html[data-theme=nuit] tr.click:hover td{background:var(--hover)}
html[data-theme=nuit] tfoot td{background:var(--soft)}
html[data-theme=nuit] .pill,html[data-theme=nuit] .tchip.lock{background:var(--soft);color:var(--ink2)}
html[data-theme=nuit] .b-sus,html[data-theme=nuit] .b-free{background:var(--soft);color:#94a3b8}
html[data-theme=nuit] .bar,html[data-theme=nuit] .rbar{background:var(--line)}
html[data-theme=nuit] .btn.sec{background:var(--soft);color:var(--ink);border-color:var(--line)}
html[data-theme=nuit] .btn.sec:hover{background:var(--hover)}
html[data-theme=nuit] .btn.danger{background:transparent;border-color:rgba(248,113,113,.4)}
html[data-theme=nuit] .chip,html[data-theme=nuit] .tadd{background:var(--soft);color:var(--ink2);border-color:var(--line)}
html[data-theme=nuit] .chip.on,html[data-theme=nuit] .seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
html[data-theme=nuit] :is(.main,.ov) :is(input,select,textarea),html[data-theme=nuit] .inp,html[data-theme=nuit] .sel,html[data-theme=nuit] .inline-in,html[data-theme=nuit] .search input{background:#0d1526!important;border-color:var(--line);color:var(--ink)}
html[data-theme=nuit] .modal,html[data-theme=nuit] .msheet{background:var(--card)}
html[data-theme=nuit] .mf{background:var(--soft)}
html[data-theme=nuit] .tg,html[data-theme=nuit] .imgt,html[data-theme=nuit] .seg{border-color:var(--line)}
html[data-theme=nuit] .addp{background:var(--soft);border-color:var(--line)}
html[data-theme=nuit] .addp .tg{background:var(--card)}
html[data-theme=nuit] .imgt .pv{background:var(--soft)}
html[data-theme=nuit] .log div{border-bottom-color:var(--line)}
html[data-theme=nuit] .alert.warn{color:#fcd34d}
html[data-theme=nuit] .alert.err{color:#fca5a5}
html[data-theme=nuit] .t-rappel{background:rgba(34,211,238,.14);color:#67e8f9}
html[data-theme=nuit] .t-urgent{background:rgba(251,191,36,.16);color:#fcd34d}
html[data-theme=nuit] .t-relance{background:rgba(248,113,113,.16);color:#fca5a5}
html[data-theme=nuit] .t-ferme{background:rgba(220,38,38,.3);color:#fecaca}
html[data-theme=nuit] .t-susp{background:var(--soft);color:#94a3b8}
html[data-theme=nuit] .toast{background:#1e293b;border:1px solid var(--line)}
html[data-theme=nuit] .toast.err{background:#b91c1c}
html[data-theme=nuit] #mOutCard{background:var(--card)!important;border-color:rgba(248,113,113,.35)!important}
html[data-theme=nuit] #mOutCard .mo-ic{background:rgba(248,113,113,.14);color:#f87171}
html[data-theme=nuit] #mtab{background:rgba(17,26,46,.92);border-top-color:var(--line)}
html[data-theme=nuit] .tabs{background:var(--card)}
html[data-theme=nuit] .tw table.mcards tbody tr{background:var(--card);border-color:var(--line)}
html[data-theme=nuit] .tw table.mcards tbody tr.click:active{background:var(--hover)}
html[data-theme=nuit] .tw table.mcards tbody td.mtitle{border-bottom-color:var(--line)!important}
html[data-theme=nuit] .msheet .mi{color:var(--ink)}
html[data-theme=nuit] .msheet .mi:active{background:var(--soft)}
html[data-theme=nuit] .msheet .who{border-bottom-color:var(--line)}
@media print{html[data-theme]{--bg:#fff;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f1f5f9;color-scheme:light}}

/* ---- date et heure : au centre de l'en-tête ---- */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center}
.head>.row{justify-self:end;justify-content:flex-end}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin-bottom:12px}
.crow>button{justify-self:start}
.clk{justify-self:center;display:grid;justify-items:center;gap:3px;padding:0 10px;color:var(--ink);white-space:nowrap;user-select:none;line-height:1}
.ck-hm{font-family:Inter,sans-serif;font-size:32px;font-weight:300;letter-spacing:.05em;font-variant-numeric:tabular-nums;color:var(--ink)}
.ck-hm i{font-style:normal;margin:0 1px;color:var(--blue);font-weight:400}
html[data-theme=nuit] .ck-hm i{color:var(--cyan)}
.ck-dt{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-variant-numeric:tabular-nums}
.ck-dt em{font-style:normal;color:var(--blue);opacity:.7}
@media (max-width:1180px){
  .head{grid-template-columns:minmax(0,1fr) auto}
  .head>.clk{grid-column:1/-1;grid-row:1;margin-bottom:4px}
}
@media (max-width:820px){
  .head{display:flex!important}
  .head>.clk,.crow>.clk{display:none}
  .crow{display:block}
  #mtop .mtt small.clk-m{font-variant-numeric:tabular-nums;letter-spacing:.06em}
}
@media print{.clk{display:none!important}}
</style>
